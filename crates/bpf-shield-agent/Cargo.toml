[package]
name = "bpf-shield-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BPF-Shield userspace agent: loads probes, pushes policy, ships events"

[[bin]]
name = "bpf-shield-agent"
path = "src/main.rs"

[dependencies]
# `user` turns on the `aya::Pod` impls for the shared ABI structs.
bpf-shield-common = { workspace = true, features = ["user"] }

aya = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
aya-build = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
